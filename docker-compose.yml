# Layanan pendukung untuk development lokal saja. Jangan dipakai untuk production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-school-postgres
    environment:
      POSTGRES_USER: smartschool
      POSTGRES_PASSWORD: smartschool
      POSTGRES_DB: smart_school
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartschool -d smart_school"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
